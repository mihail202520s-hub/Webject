  if (state.project.size !== state.baseline.size) return true;
  for (const [k, v] of state.project.entries()) {
    if (state.baseline.get(k) !== v) return true;
  }
  return false;
}

function snapshot() {
  return {
    v: 3,
    updatedAt: Date.now(),
    lang: state.currentLang,
    project: Array.from(state.project.entries()),
    openTabs: state.openTabs,
    activeFile: state.activeFile,
    dirty: Array.from(state.dirty),
    collapsed: Array.from(state.collapsed),
    cursorPos: Array.from(state.cursorPosByFile.entries()),
    uiLang
  };
}

const persistSync = () => { try { localStorage.setItem("webject.state", JSON.stringify(snapshot())); } catch (e) {} };

function saveState() {
  try { localStorage.setItem("webject.state", JSON.stringify(snapshot())); }
  catch (e) {
    if (e && e.name === "QuotaExceededError") setStatus(tr("storageFull"), "err");
  }
}

let saveTimer = null;
const saveLater = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 500); };

function loadState() {
  try {
    const raw = localStorage.getItem("webject.state");
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s.project || !s.project.length) return false;
    const map = new Map();
    for (const pair of s.project) {
      if (Array.isArray(pair) && typeof pair[0] === "string" && typeof pair[1] === "string") map.set(pair[0], pair[1]);
    }
    if (!map.size) return false;
    state.project = map;
    state.openTabs = (s.openTabs || []).filter(n => map.has(n));
    state.activeFile = s.activeFile && map.has(s.activeFile) ? s.activeFile : null;
    state.dirty = new Set((s.dirty || []).filter(n => map.has(n)));
    state.collapsed = new Set(s.collapsed || []);
    state.currentLang = s.lang || "html";
    if (s.uiLang && I18N[s.uiLang]) uiLang = s.uiLang;
    if (Array.isArray(s.cursorPos)) {
      s.cursorPos.forEach(pair => {
        if (Array.isArray(pair) && map.has(pair[0]) && pair[1] && typeof pair[1].line === "number") {
          state.cursorPosByFile.set(pair[0], { line: pair[1].line, ch: pair[1].ch || 0 });
        }
      });
    }
    state.baseline = new Map(state.project);
    return true;
  } catch (e) { return false; }
}

function loadTemplate(lang, silent) {
  if (!silent && state.project.size > 0 && hasRealChanges()) {
    askConfirm(tr("confirmUnsavedLang"), () => applyTemplate(lang));
    els.langSelect.value = state.currentLang;
    return;
  }
  applyTemplate(lang);
}

function applyTemplate(lang) {
  state.currentLang = lang;
  els.langSelect.value = lang;
  const tpl = TEMPLATES[lang] || TEMPLATES.empty;
  state.project = new Map(Object.entries(tpl.files || {}));
  state.openTabs = [];
  state.dirty = new Set();
  state.errorCounts = new Map();
  state.activeFile = null;
  state.collapsed = new Set();
  state.selectedPath = null;
  state.renamingPath = null;
  state.cursorPosByFile = new Map();
  state.docs = new Map();
  state.undoStack = [];
  state.redoStack = [];
  state.baseline = new Map(state.project);
  if (state.cm) { try { state.cm.toTextArea(); } catch (e) {} state.cm = null; }
  const first = Array.from(state.project.keys()).sort()[0];
  if (first) {
    state.openTabs.push(first);
    state.activeFile = first;
  }
  renderTree();
  renderTabs();
  renderEditor();
  setStatus(lang === "empty" ? tr("emptyProjectLoaded") : tr("templateLoaded") + tpl.label, "ok");
  updateErrorBadge();
  updateTitle();
  saveLater();
}

function resetToEmpty() {
  const go = () => {
    state.currentLang = "empty";
    els.langSelect.value = "empty";
    state.project = new Map();
    state.openTabs = [];
    state.activeFile = null;
    state.dirty = new Set();
    state.errorCounts = new Map();
    state.collapsed = new Set();
    state.selectedPath = null;
    state.renamingPath = null;
    state.cursorPosByFile = new Map();
    state.docs = new Map();
    state.undoStack = [];
    state.redoStack = [];
    state.baseline = new Map();
    if (state.cm) { try { state.cm.toTextArea(); } catch (e) {} state.cm = null; }
    renderTree();
    renderTabs();
    renderEditor();
    setStatus(tr("emptyProjectLoaded"), "ok");
    updateErrorBadge();
    updateTitle();
    saveLater();
  };
  if (state.project.size > 0 && hasRealChanges()) {
    askConfirm(tr("confirmEmpty"), go);
    return;
  }
  go();
}

function renderTree() {
  if (state.treeRaf) cancelAnimationFrame(state.treeRaf);
  state.treeRaf = requestAnimationFrame(() => {
    state.treeRaf = null;
    const filter = els.searchInput.value.trim().toLowerCase();
    let matches = null;
    if (filter) {
      matches = new Set();
      for (const k of state.project.keys()) {
        if (k.toLowerCase().includes(filter)) matches.add(k);
        const parts = k.split("/");
        for (let i = 1; i < parts.length; i++) {
          if (parts.slice(0, i).join("/").toLowerCase().includes(filter)) matches.add(k);
        }
      }
    }
    els.tree.innerHTML = "";
    els.fileCount.textContent = state.project.size;
    renderNode(els.tree, buildTree(state.project), "", 0, matches);
    paintTreeErrors();
  });
}

function renderNode(container, node, prefix, depth, matches) {
  const folderNames = Array.from(node.folders.keys()).sort();
  const fileNames = Array.from(node.files.keys()).sort();

  folderNames.forEach(name => {
    const path = prefix ? prefix + "/" + name : name;
    let hasMatch = true;
    if (matches) {
      hasMatch = false;
      for (const k of matches) {
        if (k === path || k.startsWith(path + "/")) { hasMatch = true; break; }
      }
    }
    if (!hasMatch) return;
    const isCollapsed = state.collapsed.has(path) && !matches;
    const row = document.createElement("div");
    row.className = "node" + (state.selectedPath === path ? " selected" : "");
    row.style.paddingLeft = (10 + depth * 12) + "px";
    row.dataset.path = path;
    row.dataset.kind = "folder";
    row.title = path;
    row.setAttribute("role", "treeitem");
    row.setAttribute("aria-expanded", String(!isCollapsed));
    row.setAttribute("tabindex", "-1");
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.style.transform = `rotate(${isCollapsed ? 0 : 90}deg)`;
    arrow.textContent = "▶";
    row.appendChild(arrow);
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = isCollapsed ? "📁" : "📂";
    row.appendChild(icon);
    if (state.renamingPath === path) {
      row.appendChild(makeRenameInput(name, path));
    } else {
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = name;
      row.appendChild(nameEl);
    }
    row.onclick = e => {
      if (state.renamingPath === path) return;
      if (state.collapsed.has(path)) state.collapsed.delete(path); else state.collapsed.add(path);
      state.selectedPath = path;
      renderTree();
      saveLater();
    };
    row.ondblclick = e => { e.stopPropagation(); beginRename(path); };
    row.oncontextmenu = e => {
      e.preventDefault();
      e.stopPropagation();
      state.selectedPath = path;
      renderTree();
      openMenu(e.clientX, e.clientY, "folder", path);
    };
    row.draggable = true;
    row.ondragstart = e => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", path);
      state.dropSourcePath = path;
    };
    row.ondragover = e => {
      if (state.dropSourcePath && state.dropSourcePath !== path && !state.dropSourcePath.startsWith(path + "/")) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add("drop-target");
      }
    };
    row.ondragleave = () => row.classList.remove("drop-target");
    row.ondrop = e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drop-target");
      const src = e.dataTransfer.getData("text/plain") || state.dropSourcePath;
      state.dropSourcePath = null;
      if (src && src !== path) movePath(src, path);
    };
    container.appendChild(row);
    if (!isCollapsed) {
      const wrap = document.createElement("div");
      wrap.className = "children";
      renderNode(wrap, node.folders.get(name), path, depth + 1, matches);
      container.appendChild(wrap);
    }
  });

  fileNames.forEach(name => {
    const path = prefix ? prefix + "/" + name : name;
    if (matches && !matches.has(path)) return;
    const ext = extOf(name);
    const errs = state.errorCounts.get(path) || 0;
    const row = document.createElement("div");
    row.className = "node" + (state.activeFile === path ? " active" : "") + (state.selectedPath === path ? " selected" : "");
    row.style.paddingLeft = (10 + depth * 12 + 12) + "px";
    row.dataset.path = path;
    row.dataset.kind = "file";
    row.title = path;
    row.setAttribute("role", "treeitem");
    row.setAttribute("tabindex", "-1");
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    row.appendChild(arrow);
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = iconFor(path);
    row.appendChild(icon);
    if (state.renamingPath === path) {
      row.appendChild(makeRenameInput(name, path));
    } else {
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = name;
      row.appendChild(nameEl);
    }
    if (errs > 0) {
      const mark = document.createElement("span");
      mark.className = "err-mark";
      mark.textContent = "●";
      mark.title = errs + " ошиб.";
      row.appendChild(mark);
    }
    if (ext) {
      const extEl = document.createElement("span");
      extEl.className = "ext";
      extEl.textContent = ext;
      row.appendChild(extEl);
    }
    row.onclick = () => {
      if (state.renamingPath === path) return;
      state.selectedPath = path;
      openFile(path);
    };
    row.ondblclick = e => { e.stopPropagation(); beginRename(path); };
    row.oncontextmenu = e => {
      e.preventDefault();
      e.stopPropagation();
      state.selectedPath = path;
      renderTree();
      openMenu(e.clientX, e.clientY, "file", path);
    };
    row.draggable = true;
    row.ondragstart = e => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", path);
      state.dropSourcePath = path;
    };
    row.ondragover = e => {
      if (state.dropSourcePath && state.dropSourcePath !== path) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        row.classList.add("drop-target");
      }
    };
    row.ondragleave = () => row.classList.remove("drop-target");
    row.ondrop = e => {
      e.preventDefault();
      e.stopPropagation();
      row.classList.remove("drop-target");
      const src = e.dataTransfer.getData("text/plain") || state.dropSourcePath;
      state.dropSourcePath = null;
      if (src && src !== path) movePath(src, parentOf(path));
    };
    container.appendChild(row);
  });
}

function makeRenameInput(initialName, path) {
  const input = document.createElement("input");
  input.className = "rename-input";
  input.value = initialName;
  input.onclick = e => e.stopPropagation();
  input.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); finishRename(path, input.value); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); state.renamingPath = null; renderTree(); }
  };
  input.onblur = () => { if (state.renamingPath === path) finishRename(path, input.value); };
  setTimeout(() => { input.focus(); input.select(); }, 0);
  return input;
}

function pushUndo(action) {
  state.undoStack.push(action);
  if (state.undoStack.length > 50) state.undoStack.shift();
  state.redoStack = [];
}

const undoLast = () => {
  if (!state.undoStack.length) return;
  const a = state.undoStack.pop();
  a.undo();
  state.redoStack.push(a);
  renderTree();
  setStatus("Отменено", "ok");
  saveLater();
};

const redoLast = () => {
  if (!state.redoStack.length) return;
  const a = state.redoStack.pop();
  a.redo();
  state.undoStack.push(a);
  renderTree();
  setStatus("Повторено", "ok");
  saveLater();
};

function beginRename(path) { state.renamingPath = path; renderTree(); }

function finishRename(oldPath, newName) {
  state.renamingPath = null;
  newName = (newName || "").trim();
  const oldName = oldPath.split("/").pop();
  if (!newName || newName === oldName) { renderTree(); return; }
  if (!isValidName(newName)) { setStatus(tr("invalidName"), "warn"); renderTree(); return; }
  const dir = parentOf(oldPath);
  const newPath = dir ? dir + "/" + newName : newName;
  const isFile = state.project.has(oldPath);
  if (isFile) {
    if (state.project.has(newPath)) { setStatus(tr("nameExists"), "warn"); renderTree(); return; }
    moveFileEntry(oldPath, newPath);
    pushUndo({
      undo: () => { moveFileEntry(newPath, oldPath); renderTree(); renderTabs(); renderEditor(); },
      redo: () => { moveFileEntry(oldPath, newPath); renderTree(); renderTabs(); renderEditor(); }
    });
  } else {
    const exists = Array.from(state.project.keys()).some(k => k === newPath || k.startsWith(newPath + "/"));
    if (exists) { setStatus(tr("nameExists"), "warn"); renderTree(); return; }
    moveFolderEntry(oldPath, newPath);
    pushUndo({
      undo: () => { moveFolderEntry(newPath, oldPath); renderTree(); renderTabs(); renderEditor(); },
      redo: () => { moveFolderEntry(oldPath, newPath); renderTree(); renderTabs(); renderEditor(); }
    });
  }
  renderTree();
  renderTabs();
  renderEditor();
  setStatus(tr("renamed") + oldPath + " → " + newPath, "ok");
  saveLater();
}

function moveFileEntry(oldPath, newPath) {
  const content = state.project.get(oldPath);
  state.project.delete(oldPath);
  state.project.set(newPath, content);
  if (state.dirty.has(oldPath)) { state.dirty.delete(oldPath); state.dirty.add(newPath); }
  if (state.errorCounts.has(oldPath)) { state.errorCounts.set(newPath, state.errorCounts.get(oldPath)); state.errorCounts.delete(oldPath); }
  if (state.cursorPosByFile.has(oldPath)) { state.cursorPosByFile.set(newPath, state.cursorPosByFile.get(oldPath)); state.cursorPosByFile.delete(oldPath); }
  if (state.docs.has(oldPath)) {
    const doc = state.docs.get(oldPath);
    doc._file = newPath;
    state.docs.set(newPath, doc);
    state.docs.delete(oldPath);
  }
  state.openTabs = state.openTabs.map(n => n === oldPath ? newPath : n);
  if (state.activeFile === oldPath) state.activeFile = newPath;
  if (state.selectedPath === oldPath) state.selectedPath = newPath;
}

function moveFolderEntry(oldPath, newPath) {
  const prefix = oldPath + "/";
  const moves = [];
  for (const [k, v] of state.project.entries()) {
    if (k.startsWith(prefix)) moves.push([k, newPath + "/" + k.slice(prefix.length), v]);
  }
  moves.forEach(([oldK, newK, v]) => {
    state.project.delete(oldK);
    state.project.set(newK, v);
    if (state.dirty.has(oldK)) { state.dirty.delete(oldK); state.dirty.add(newK); }
    if (state.errorCounts.has(oldK)) { state.errorCounts.set(newK, state.errorCounts.get(oldK)); state.errorCounts.delete(oldK); }
    if (state.cursorPosByFile.has(oldK)) { state.cursorPosByFile.set(newK, state.cursorPosByFile.get(oldK)); state.cursorPosByFile.delete(oldK); }
    if (state.docs.has(oldK)) {
      const doc = state.docs.get(oldK);
      doc._file = newK;
      state.docs.set(newK, doc);
      state.docs.delete(oldK);
    }
  });
  state.openTabs = state.openTabs.map(n => n.startsWith(prefix) ? newPath + "/" + n.slice(prefix.length) : n);
  if (state.activeFile && state.activeFile.startsWith(prefix)) state.activeFile = newPath + "/" + state.activeFile.slice(prefix.length);
  if (state.selectedPath && state.selectedPath.startsWith(prefix)) state.selectedPath = newPath + "/" + state.selectedPath.slice(prefix.length);
  const newCollapsed = new Set();
  state.collapsed.forEach(c => {
    if (c === oldPath) newCollapsed.add(newPath);
    else if (c.startsWith(prefix)) newCollapsed.add(newPath + "/" + c.slice(prefix.length));
    else newCollapsed.add(c);
  });
  state.collapsed = newCollapsed;
  if (state.selectedPath === oldPath) state.selectedPath = newPath;
}

function movePath(srcPath, destDir) {
  if (destDir && (destDir === srcPath || destDir.startsWith(srcPath + "/"))) {
    setStatus(tr("cantMoveIntoSelf"), "warn");
    return;
  }
  const srcName = srcPath.split("/").pop();
  const newPath = destDir ? destDir + "/" + srcName : srcName;
  if (newPath === srcPath) return;
  const isFile = state.project.has(srcPath);
  if (isFile) {
    if (state.project.has(newPath)) { setStatus(tr("fileExistsInTarget"), "warn"); return; }
    moveFileEntry(srcPath, newPath);
    pushUndo({
      undo: () => { moveFileEntry(newPath, srcPath); renderTree(); renderTabs(); renderEditor(); },
      redo: () => { moveFileEntry(srcPath, newPath); renderTree(); renderTabs(); renderEditor(); }
    });
    setStatus(tr("moved") + srcPath + " → " + newPath, "ok");
  } else {
    const exists = Array.from(state.project.keys()).some(k => k === newPath || k.startsWith(newPath + "/"));
    if (exists) { setStatus(tr("folderExistsInTarget"), "warn"); return; }
    moveFolderEntry(srcPath, newPath);
    pushUndo({
      undo: () => { moveFolderEntry(newPath, srcPath); renderTree(); renderTabs(); renderEditor(); },
      redo: () => { moveFolderEntry(srcPath, newPath); renderTree(); renderTabs(); renderEditor(); }
    });
    setStatus(tr("movedFolder") + srcPath + " → " + newPath, "ok");
  }
  renderTree();
  renderTabs();
  renderEditor();
  saveLater();
}

function removeFile(path) {
  askConfirm(tr("confirmDeleteFile") + path + "?", () => {
    const content = state.project.get(path);
    const wasDirty = state.dirty.has(path);
    const wasCursor = state.cursorPosByFile.get(path);
    const wasOpen = state.openTabs.includes(path);
    state.project.delete(path);
    state.dirty.delete(path);
    state.errorCounts.delete(path);
    state.cursorPosByFile.delete(path);
    state.docs.delete(path);
    state.openTabs = state.openTabs.filter(n => n !== path);
    if (state.activeFile === path) state.activeFile = state.openTabs.length ? state.openTabs[state.openTabs.length - 1] : null;
    if (state.selectedPath === path) state.selectedPath = null;
    pushUndo({
      undo: () => {
        state.project.set(path, content);
        if (wasDirty) state.dirty.add(path);
        if (wasCursor) state.cursorPosByFile.set(path, wasCursor);
        if (wasOpen && !state.openTabs.includes(path)) state.openTabs.push(path);
        renderTree(); renderTabs(); renderEditor();
      },
      redo: () => {
        state.project.delete(path);
        state.dirty.delete(path);
        state.errorCounts.delete(path);
        state.docs.delete(path);
        state.openTabs = state.openTabs.filter(n => n !== path);
        if (state.activeFile === path) state.activeFile = state.openTabs.length ? state.openTabs[state.openTabs.length - 1] : null;
        renderTree(); renderTabs(); renderEditor();
      }
    });
    renderTree(); renderTabs(); renderEditor();
    setStatus(tr("fileDeleted") + path, "warn");
    saveLater();
  });
}

function removeFolder(path) {
  const toRemove = Array.from(state.project.keys()).filter(k => k === path || k.startsWith(path + "/"));
  if (!toRemove.length) return;
  askConfirm(tr("confirmDeleteFolder") + path + tr("andAllContent") + toRemove.length + tr("filesWord"), () => {
    const saved = toRemove.map(k => [k, state.project.get(k), state.dirty.has(k), state.openTabs.includes(k), state.cursorPosByFile.get(k)]);
    toRemove.forEach(k => {
      state.project.delete(k);
      state.dirty.delete(k);
      state.errorCounts.delete(k);
      state.cursorPosByFile.delete(k);
      state.docs.delete(k);
      state.openTabs = state.openTabs.filter(n => n !== k);
    });
    Array.from(state.collapsed).forEach(c => { if (c === path || c.startsWith(path + "/")) state.collapsed.delete(c); });
    if (state.activeFile && (state.activeFile === path || state.activeFile.startsWith(path + "/"))) state.activeFile = state.openTabs.length ? state.openTabs[state.openTabs.length - 1] : null;
    if (state.selectedPath && (state.selectedPath === path || state.selectedPath.startsWith(path + "/"))) state.selectedPath = null;
    pushUndo({
      undo: () => {
        saved.forEach(([k, v, d, o, c]) => {
          state.project.set(k, v);
          if (d) state.dirty.add(k);
          if (o && !state.openTabs.includes(k)) state.openTabs.push(k);
          if (c) state.cursorPosByFile.set(k, c);
        });
        renderTree(); renderTabs(); renderEditor();
      },
      redo: () => {
        saved.forEach(([k]) => {
          state.project.delete(k);
          state.dirty.delete(k);
          state.errorCounts.delete(k);
          state.docs.delete(k);
          state.openTabs = state.openTabs.filter(n => n !== k);
        });
        renderTree(); renderTabs(); renderEditor();
      }
    });
    renderTree(); renderTabs(); renderEditor();
    setStatus(tr("folderDeleted") + path, "warn");
    saveLater();
  });
}

function isValidName(name) {
  if (!name || name === "." || name === "..") return false;
  if (name.length > 255) return false;
  if (/[<>:"|?*\x00-\x1f]/.test(name)) return false;
  if (/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$/i.test(name)) return false;
  if (name !== name.trim()) return false;
  return true;
}

function renderTabs() {
  if (state.tabsRaf) cancelAnimationFrame(state.tabsRaf);
  state.tabsRaf = requestAnimationFrame(() => {
    state.tabsRaf = null;
    els.tabBar.innerHTML = "";
    state.openTabs.forEach(name => {
      const tab = document.createElement("div");
      tab.className = "tab" + (state.activeFile === name ? " active" : "");
      tab.setAttribute("role", "tab");
      tab.setAttribute("tabindex", state.activeFile === name ? "0" : "-1");
      tab.dataset.path = name;
      const label = document.createElement("span");
      label.textContent = name;
      tab.appendChild(label);
      const errs = state.errorCounts.get(name) || 0;
      if (state.dirty.has(name) || errs > 0) {
        const dot = document.createElement("span");
        dot.className = "dot" + (errs > 0 ? " err" : "");
        tab.appendChild(dot);
      }
      const close = document.createElement("button");
      close.className = "close";
      close.textContent = "×";
      close.setAttribute("aria-label", "Close " + name);
      close.onclick = e => { e.stopPropagation(); closeTab(name); };
      tab.appendChild(close);
      tab.onclick = () => openFile(name);
      tab.onauxclick = e => { if (e.button === 1) closeTab(name); };
      tab.oncontextmenu = e => {
        e.preventDefault();
        openMenu(e.clientX, e.clientY, "tab", name);
      };
      els.tabBar.appendChild(tab);
    });
    updateTitle();
  });
}

function downloadFile(name) {
  const content = state.project.get(name) || "";
  const mime = MIME_BY_EXT[extOf(name)] || "text/plain";
  const blob = new Blob([content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name.split("/").pop();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus(tr("downloaded") + name, "ok");
}

function openFile(name) {
  if (!state.project.has(name)) { setStatus(tr("notFound") + name, "warn"); return; }
  if (state.activeFile === name) return;
  if (state.activeFile && state.cm) {
    const p = state.cm.getCursor();
    state.cursorPosByFile.set(state.activeFile, { line: p.line, ch: p.ch });
  }
  if (!state.openTabs.includes(name)) state.openTabs.push(name);
  state.activeFile = name;
  const parts = name.split("/");
  for (let i = 1; i < parts.length; i++) state.collapsed.delete(parts.slice(0, i).join("/"));
  renderTree();
  renderTabs();
  renderEditor();
  refreshRunBtn();
  setStatus(tr("opened") + name, "ok");
  saveLater();
  requestAnimationFrame(() => {
    const row = els.tree.querySelector(`.node[data-path="${CSS.escape(name)}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
  });
}

function closeTab(name) {
  if (state.dirty.has(name)) {
    askConfirm(tr("confirmCloseDirty") + name + tr("confirmCloseDirtyEnd"), () => reallyCloseTab(name));
    return;
  }
  reallyCloseTab(name);
}

function reallyCloseTab(name) {
  state.openTabs = state.openTabs.filter(n => n !== name);
  if (state.activeFile === name) state.activeFile = state.openTabs.length ? state.openTabs[state.openTabs.length - 1] : null;
  renderTree(); renderTabs(); renderEditor();
  refreshRunBtn();
  saveLater();
}

function setupEditor(container) {
  if (typeof CodeMirror === "undefined") return null;
  container.innerHTML = "";
  const cm = CodeMirror(container, {
    value: "",
    mode: null,
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    lineWrapping: false,
    autoCloseBrackets: true,
    autoCloseTags: true,
    matchBrackets: true,
    styleActiveLine: true,
    highlightSelectionMatches: true,
    foldGutter: true,
    theme: "darcula",
    gutters: ["CodeMirror-lint-markers", "CodeMirror-linenumbers", "CodeMirror-foldgutter"],
    hintOptions: { completeSingle: false },
    extraKeys: {
      "Ctrl-/": "toggleComment",
      "Cmd-/": "toggleComment",
      "Alt-Up": "moveLineUp",
      "Alt-Down": "moveLineDown",
      "Shift-Ctrl-K": "deleteLine",
      "Ctrl-Space": "autocomplete",
      "Ctrl-F": "findPersistent",
      "Ctrl-H": "replace",
      "Cmd-F": "findPersistent",
      "Cmd-H": "replace",
      "Ctrl-G": () => openGoto(),
      "Ctrl-Enter": () => { if (state.activeFile) previewHtml(state.activeFile); }
    },
    lint: {
      getAnnotations: text => {
        let file = state.activeFile;
        if (state.cm) {
          const curDoc = state.cm.getDoc();
          for (const [k, d] of state.docs) {
            if (d === curDoc) { file = k; break; }
          }
        }
        const mode = modeFor(file || "");
        if (!mode || !file) return [];
        const errs = lintSync(text, mode);
        state.errorCounts.set(file, errs.length);
        scheduleBadge();
        return errs;
      },
      async: false
    }
  });
  cm.setSize("100%", "100%");
  return cm;
}

function renderEditor() {
  if (!state.activeFile || !state.project.has(state.activeFile)) {
    if (state.cm) { try { state.cm.toTextArea(); } catch (e) {} state.cm = null; }
    refreshRunBtn();
    if (state.project.size === 0) {
      els.editorArea.innerHTML = `
        <div class="empty">
          <div class="big">📂</div>
          ${escapeHtml(tr("emptyTitle"))}
          <span>${escapeHtml(tr("emptyHint"))}</span>
          <span class="hint"><button class="control primary" id="emptyCreateFile" style="margin-top:8px">${escapeHtml(tr("createFile"))}</button></span>
        </div>`;
      const btn = document.getElementById("emptyCreateFile");
      if (btn) btn.onclick = () => askNew("file", "");
    } else {
      els.editorArea.innerHTML = `<div class="empty"><div class="big">📂</div>${escapeHtml(tr("emptyEditorHint"))}<span>${escapeHtml(tr("dblClickRename"))}</span><span class="hint">${escapeHtml(tr("hintBar"))}</span></div>`;
    }
    updateInfo();
    updateErrorBadge();
    return;
  }
  const file = state.activeFile;
  const content = state.project.get(file) || "";
  const mode = modeFor(file);
  if (!state.cm) {
    state.cm = setupEditor(els.editorArea);
    if (!state.cm) {
      els.editorArea.innerHTML = `<div class="empty"><div class="big">⚠</div>${escapeHtml(tr("noCodeMirror"))}<span>${escapeHtml(tr("checkInternet"))}</span></div>`;
      setStatus(tr("noCodeMirror"), "err");
      return;
    }
    state.cm.on("cursorActivity", () => {
      if (!state.activeFile) return;
      const p = state.cm.getCursor();
      state.cursorPosByFile.set(state.activeFile, { line: p.line, ch: p.ch });
      updateInfo();
    });
    state.cm.on("change", () => {
      const cur = state.activeFile;
      if (!cur || !state.project.has(cur)) return;
      const val = state.cm.getValue();
      if (state.project.get(cur) === val) return;
      state.project.set(cur, val);
      state.dirty.add(cur);
      renderTabs();
      updateInfo();
      saveLater();
    });
  }
  state.cm.setOption("mode", mode);
  const currentVal = state.cm.getValue();
  if (currentVal !== content) state.cm.setValue(content);
  state.cm.setOption("lineNumbers", true);
  const saved = state.cursorPosByFile.get(file);
  if (saved && typeof saved.line === "number") state.cm.setCursor({ line: saved.line, ch: saved.ch || 0 });
  else state.cm.setCursor({ line: 0, ch: 0 });
  state.cm.refresh();
  requestAnimationFrame(() => { if (state.cm) { state.cm.refresh(); state.cm.focus(); } });
  setTimeout(() => { if (state.cm) state.cm.refresh(); }, 80);
  setTimeout(() => { if (state.cm) state.cm.refresh(); }, 250);
  clearTimeout(state.lintTimer);
  state.lintTimer = setTimeout(() => { if (state.cm) state.cm.performLint(); }, 120);
  updateInfo();
  refreshRunBtn();
}

let badgeTimer = null;
function scheduleBadge() {
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(() => {
    updateErrorBadge();
    paintTreeErrors();
    paintTabErrors();
  }, 200);
}

function paintTreeErrors() {
  els.tree.querySelectorAll(".node[data-kind='file']").forEach(row => {
    const path = row.dataset.path;
    const errs = state.errorCounts.get(path) || 0;
    let mark = row.querySelector(".err-mark");
    if (errs > 0 && !mark) {
      mark = document.createElement("span");
      mark.className = "err-mark";
      mark.textContent = "●";
      const ext = row.querySelector(".ext");
      if (ext) row.insertBefore(mark, ext); else row.appendChild(mark);
    }
    if (mark) {
      if (errs > 0) mark.title = errs + " err.";
      else mark.remove();
    }
  });
}

function paintTabErrors() {
  els.tabBar.querySelectorAll(".tab").forEach(tab => {
    const name = tab.dataset.path;
    if (!name) return;
    const errs = state.errorCounts.get(name) || 0;
    const dirty = state.dirty.has(name);
    const dot = tab.querySelector(".dot");
    if (errs > 0 || dirty) {
      if (!dot) {
        const d = document.createElement("span");
        d.className = "dot" + (errs > 0 ? " err" : "");
        const close = tab.querySelector(".close");
        if (close) tab.insertBefore(d, close); else tab.appendChild(d);
      } else {
        if (errs > 0) dot.classList.add("err"); else dot.classList.remove("err");
      }
    } else if (dot) {
      dot.remove();
    }
  });
}

function setStatus(text, cls) {
  els.statusMsg.textContent = text;
  els.statusMsg.className = cls || "";
}

function trapFocus(on) {
  if (typeof on !== "boolean") return;
  [document.querySelector("header"), els.mainMain, document.querySelector(".status")].forEach(t => {
    if (t) t.inert = on;
  });
}

function openModal(mode, parent, title, hint, bodyHTML, okLabel) {
  state.modalMode = mode;
  state.modalParent = parent || "";
  els.modalTitle.textContent = title || tr("newFile");
  els.modalHint.textContent = hint || "";
  els.modalBody.innerHTML = bodyHTML || `<input id="modalInput" placeholder="" autocomplete="off">`;
  els.modalOk.textContent = okLabel || tr("create");
  els.modalOk.onclick = null;
  els.modalBg.classList.add("show");
  trapFocus(true);
  const first = els.modalBody.querySelector("input, select, button");
  if (first) setTimeout(() => first.focus(), 0);
}

function closeModal() {
  els.modalBg.classList.remove("show");
  trapFocus(false);
}

function askConfirm(message, onOk) {
  openModal("confirm", "", tr("confirmTitle"), "",
    `<div class="hint">${escapeHtml(message)}</div>`,
    tr("ok"));
  els.modalOk.onclick = () => { closeModal(); onOk(); };
}

function askNew(mode, parent) {
  openModal(mode, parent,
    mode === "file" ? tr("newFile") : tr("newFolder"),
    parent ? (uiLang === "ru" ? "Внутри папки: " : "Inside folder: ") + parent : (uiLang === "ru" ? "В корне проекта" : "In project root"),
    `<input id="modalInput" placeholder="${mode === "file" ? "e.g., utils.py" : "e.g., components"}" autocomplete="off">`,
    tr("create"));
  const input = els.modalBody.querySelector("#modalInput");
  els.modalOk.onclick = doCreate;

  function doCreate() {
    const raw = input.value.trim();
    if (!raw) return;
    const clean = raw.replace(/^\/+|\/+$/g, "");
    if (!clean) return;
    const parts = clean.split("/");
    if (parts.some(p => !isValidName(p))) { setStatus(tr("pathInvalid"), "warn"); return; }
    const full = parent ? parent + "/" + clean : clean;
    if (mode === "file") {
      if (state.project.has(full)) { setStatus(tr("fileExists"), "warn"); return; }
      state.project.set(full, "");
      state.dirty.add(full);
      closeModal();
      openFile(full);
      setStatus(tr("fileCreated") + full, "ok");
    } else {
      const marker = full + "/.gitkeep";
      if (state.project.has(marker) || state.project.has(full)) { setStatus(tr("folderExists"), "warn"); return; }
      state.project.set(marker, "");
      state.collapsed.delete(full);
      closeModal();
      renderTree();
      setStatus(tr("folderCreated") + full, "ok");
    }
    saveLater();
  }
}

function openGoto() {
  if (!state.cm) { setStatus(tr("noOpenFile"), "warn"); return; }
  openModal("goto", "", tr("gotoLine"), tr("lineNumber"), `<input id="modalInput" type="number" min="1" placeholder="${tr("gotoPlaceholder")}" autocomplete="off">`, tr("gotoBtn"));
  const input = els.modalBody.querySelector("#modalInput");
  els.modalOk.onclick = () => {
    const n = parseInt(input.value);
    if (!n || n < 1) return;
    const line = Math.min(n - 1, state.cm.lineCount() - 1);
    state.cm.setCursor({ line, ch: 0 });
    state.cm.scrollIntoView({ line, ch: 0 }, 100);
    state.cm.focus();
    closeModal();
  };
}

function openMenu(x, y, kind, path) {
  const menu = els.ctxMenu;
  menu.innerHTML = "";
  const items = [];

  if (kind === "empty") {
    items.push({ label: tr("ctxNewFile"), icon: "📄", action: () => askNew("file", "") });
    items.push({ label: tr("ctxNewFolder"), icon: "📁", action: () => askNew("folder", "") });
    items.push({ sep: true });
    items.push({ label: tr("ctxCollapseAll"), icon: "⊟", action: () => collapseAll(true) });
    items.push({ label: tr("ctxExpandAll"), icon: "⊞", action: () => collapseAll(false) });
    items.push({ label: tr("ctxImportFiles"), icon: "⬆", action: importFiles });
    items.push({ sep: true });
    items.push({ label: tr("ctxClearProject"), icon: "🧹", danger: true, action: resetToEmpty });
  } else if (kind === "folder") {
    items.push({ label: tr("ctxNewFile"), icon: "📄", action: () => askNew("file", path) });
    items.push({ label: tr("ctxNewFolder"), icon: "📁", action: () => askNew("folder", path) });
    items.push({ sep: true });
    items.push({ label: tr("ctxRename"), icon: "✎", kbd: "F2", action: () => beginRename(path) });
    items.push({ label: tr("ctxCopyPath"), icon: "📋", action: () => copyPath(path) });
    items.push({ label: tr("ctxDeleteFolder"), icon: "🗑", danger: true, action: () => removeFolder(path) });
  } else if (kind === "file") {
    items.push({ label: tr("ctxOpen"), icon: "↗", action: () => openFile(path) });
    items.push({ label: tr("ctxDownload"), icon: "⬇", action: () => downloadFile(path) });
    if (extOf(path) === "html") items.push({ label: tr("ctxPreview"), icon: "▶", kbd: "Ctrl+Enter", action: () => previewHtml(path) });
    items.push({ sep: true });
    items.push({ label: tr("ctxRename"), icon: "✎", kbd: "F2", action: () => beginRename(path) });
    items.push({ label: tr("ctxCopyPath"), icon: "📋", action: () => copyPath(path) });
    if (canFormat(path)) items.push({ label: tr("ctxFormat"), icon: "✨", kbd: "Shift+Alt+F", action: () => formatFile(path) });
    if (extOf(path) === "html") items.push({ label: tr("ctxDownloadOne"), icon: "🌐", action: () => downloadSingleHtml(path) });
    items.push({ label: tr("ctxDeleteFile"), icon: "🗑", danger: true, action: () => removeFile(path) });
  } else if (kind === "tab") {
    items.push({ label: tr("ctxClose"), icon: "✕", kbd: "Ctrl+W", action: () => closeTab(path) });
    items.push({ label: tr("ctxCloseOthers"), icon: "⊟", action: () => {
      state.openTabs = [path];
      state.activeFile = path;
      renderTabs(); renderTree(); renderEditor();
    }});
    items.push({ sep: true });
    items.push({ label: tr("ctxDownload"), icon: "⬇", action: () => downloadFile(path) });
    items.push({ label: tr("ctxRename"), icon: "✎", action: () => beginRename(path) });
  }

  items.forEach(it => {
    if (it.sep) {
      const sep = document.createElement("div");
      sep.className = "ctx-sep";
      menu.appendChild(sep);
      return;
    }
    const btn = document.createElement("button");
    btn.className = "ctx-item" + (it.danger ? " danger" : "");
    const iconEl = document.createElement("span");
    iconEl.textContent = it.icon;
    const labelEl = document.createElement("span");
    labelEl.textContent = it.label;
    btn.appendChild(iconEl);
    btn.appendChild(labelEl);
    if (it.kbd) {
      const kbd = document.createElement("span");
      kbd.className = "kbd";
      kbd.textContent = it.kbd;
      btn.appendChild(kbd);
    }
    btn.onclick = e => { e.stopPropagation(); hideMenu(); it.action(); };
    menu.appendChild(btn);
  });

  menu.style.visibility = "hidden";
  menu.style.left = "0px";
  menu.style.top = "0px";
  menu.classList.add("show");
  const rect = menu.getBoundingClientRect();
  const w = rect.width || 220;
  const h = rect.height || 200;
  menu.style.left = Math.min(x, Math.max(8, window.innerWidth - w - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - h - 8)) + "px";
  menu.style.visibility = "";
}

const hideMenu = () => els.ctxMenu.classList.remove("show");

function copyPath(path) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(path).then(
      () => setStatus(tr("copiedPath") + path, "ok"),
      () => setStatus(tr("copyFailed"), "warn")
    );
  } else {
    setStatus(tr("clipboardUnavailable"), "warn");
  }
}

function collapseAll(collapse) {
  if (collapse) {
    state.collapsed = new Set();
    const walk = (node, prefix) => {
      node.folders.forEach((v, f) => {
        const p = prefix ? prefix + "/" + f : f;
        state.collapsed.add(p);
        walk(v, p);
      });
    };
    walk(buildTree(state.project), "");
  } else {
    state.collapsed = new Set();
  }
  renderTree();
  saveLater();
}

function formatFile(path) {
  if (!state.project.has(path)) return;
  if (!canFormat(path)) { setStatus(tr("formatNotSupported"), "warn"); return; }
  const content = state.project.get(path);
  const ext = extOf(path);
  let formatted = content;
  try {
    if (ext === "json") formatted = JSON.stringify(JSON.parse(content), null, 2);
    else if ((ext === "js" || ext === "mjs") && typeof js_beautify !== "undefined") formatted = js_beautify(content, { indent_size: 4 });
    else if (ext === "css" && typeof css_beautify !== "undefined") formatted = css_beautify(content, { indent_size: 4 });
    else if ((ext === "html" || ext === "htm") && typeof html_beautify !== "undefined") formatted = html_beautify(content, { indent_size: 4 });
    else { setStatus(tr("formatNotSupported"), "warn"); return; }
  } catch (e) {
    setStatus(tr("formatError") + e.message, "err");
    return;
  }
  if (formatted === content) { setStatus(tr("alreadyFormatted"), "ok"); return; }
  state.project.set(path, formatted);
  state.dirty.add(path);
  if (state.activeFile === path && state.cm) state.cm.setValue(formatted);
  renderTree(); renderTabs();
  setStatus(tr("formatted") + path, "ok");
  saveLater();
}

function buildSingleHtml(indexPath) {
  if (!state.project.has(indexPath)) return null;
  let html = state.project.get(indexPath);
  const dir = parentOf(indexPath);
  html = html.replace(/<link[^>]*rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi, (m, href) => {
    const full = resolveRelative(dir, href);
    const css = state.project.get(full);
    return css ? "<style>\n" + css + "\n</style>" : m;
  });
  html = html.replace(/<script([^>]*)\ssrc=["']([^"']+)["']([^>]*)><\/script\s*>/gi, (m, attrs1, src, attrs2) => {
    const full = resolveRelative(dir, src);
    const js = state.project.get(full);
    if (!js) return m;
    const isModule = /type=["']module["']/i.test(attrs1 + attrs2);
    const safe = js.replace(/<\/script\s*>/gi, "<\\/script>");
    return isModule ? "<script type=\"module\">\n" + safe + "\n<\\/script>" : "<script>\n" + safe + "\n<\\/script>";
  });
  return html;
}

function previewHtml(path) {
  if (!state.project.has(path) || extOf(path) !== "html") { setStatus(tr("previewOnlyHtml"), "warn"); return; }
  const html = buildSingleHtml(path);
  if (!html) return;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  setStatus(tr("previewOpened"), "ok");
}

function downloadSingleHtml(indexPath) {
  if (extOf(indexPath) !== "html") return;
  const html = buildSingleHtml(indexPath);
  if (!html) return;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus(tr("downloadedOne"), "ok");
}

function resolveRelative(baseDir, rel) {
  if (!rel || /^(https?:|data:|\/|#)/.test(rel)) return "";
  rel = decodeURIComponent(rel.split("?")[0].split("#")[0]);
  const parts = (baseDir ? baseDir + "/" : "").split("/").filter(Boolean);
  rel.split("/").forEach(p => {
    if (p === "..") parts.pop();
    else if (p !== "." && p) parts.push(p);
  });
  return parts.join("/");
}

function addFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;
  let pending = files.length;
  let added = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      let target = file.name;
      let i = 1;
      while (state.project.has(target)) {
        const dot = file.name.lastIndexOf(".");
        target = dot > 0 ? file.name.slice(0, dot) + "_" + i + file.name.slice(dot) : file.name + "_" + i;
        i++;
      }
      state.project.set(target, String(reader.result));
      state.dirty.add(target);
      added++;
      if (--pending === 0) { renderTree(); saveLater(); setStatus(tr("imported") + added, "ok"); }
    };
    reader.onerror = () => {
      if (--pending === 0) { renderTree(); saveLater(); setStatus(tr("importError") + added, "err"); }
    };
    reader.readAsText(file);
  });
}

function importFiles() {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.onchange = () => addFiles(input.files);
  input.click();
}

function importJson() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.project || !Array.isArray(data.project)) throw new Error("no project");
        const map = new Map();
        for (const pair of data.project) {
          if (Array.isArray(pair) && typeof pair[0] === "string" && typeof pair[1] === "string") map.set(pair[0], pair[1]);
        }
        if (!map.size) throw new Error("empty project");
        askConfirm(tr("confirmImport") + map.size + tr("confirmImportEnd"), () => {
          state.project = map;
          state.openTabs = (data.openTabs || []).filter(n => map.has(n));
          if (!state.openTabs.length) {
            const first = Array.from(map.keys()).sort()[0];
            if (first) state.openTabs = [first];
          }
          state.activeFile = data.activeFile && map.has(data.activeFile) ? data.activeFile : (state.openTabs[0] || null);
          state.dirty = new Set();
          state.errorCounts = new Map();
          state.cursorPosByFile = new Map();
          state.docs = new Map();
          if (state.cm) { try { state.cm.toTextArea(); } catch (e) {} state.cm = null; }
          if (data.lang && TEMPLATES[data.lang]) { state.currentLang = data.lang; els.langSelect.value = data.lang; }
          state.baseline = new Map(state.project);
          renderTree(); renderTabs(); renderEditor();
          setStatus(tr("importedProject") + map.size + " " + tr("files"), "ok");
          saveLater();
        });
      } catch (e) {
        setStatus(tr("importJsonError") + e.message, "err");
      }
    };
    reader.onerror = () => setStatus(tr("readError"), "err");
    reader.readAsText(file);
  };
  input.click();
}

const updateOnlineStatus = () => {
  if (navigator.onLine) els.offlineBadge.classList.remove("show");
  else els.offlineBadge.classList.add("show");
};

function openGuide() {
  const body = `
    <div class="guide-section"><h4>${escapeHtml(tr("g1Title"))}</h4><p>${escapeHtml(tr("g1Text"))}</p></div>
    <div class="guide-section">
      <h4>${escapeHtml(tr("g2Title"))}</h4>
      <div class="step"><div class="step-num">1</div><div class="step-body">${escapeHtml(tr("g2Step1"))}</div></div>
      <div class="step"><div class="step-num">2</div><div class="step-body">${escapeHtml(tr("g2Step2"))}</div></div>
      <div class="step"><div class="step-num">3</div><div class="step-body">${escapeHtml(tr("g2Step3"))}</div></div>
    </div>
    <div class="guide-section"><h4>${escapeHtml(tr("g3Title"))}</h4><p>${escapeHtml(tr("g3Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g4Title"))}</h4><p>${escapeHtml(tr("g4Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g5Title"))}</h4><p>${escapeHtml(tr("g5Text"))}</p><p class="sub">${escapeHtml(tr("g5Note"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g6Title"))}</h4><p>${escapeHtml(tr("g6Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g7Title"))}</h4><p>${escapeHtml(tr("g7Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g8Title"))}</h4><p>${escapeHtml(tr("g8Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g9Title"))}</h4><p>${escapeHtml(tr("g9Text"))}</p></div>
    <div class="guide-section"><h4>${escapeHtml(tr("g10Title"))}</h4><p>${escapeHtml(tr("g10Text"))}</p></div>
  `;
  openModal("guide", "", tr("guideTitle"), tr("guideIntro"), body, tr("guideClose"));
  els.modalOk.onclick = closeModal;
}

document.getElementById("toggleSidebar").onclick = () => {
  els.sidebar.classList.toggle("hidden");
  setTimeout(() => { if (state.cm) state.cm.refresh(); }, 260);
};
document.getElementById("logoBtn").onclick = openGuide;
els.modalCancel.onclick = closeModal;
els.langSelect.onchange = () => loadTemplate(els.langSelect.value);

document.getElementById("regenBtn").onclick = () => {
  if (state.project.size > 0 && hasRealChanges()) {
    askConfirm(tr("confirmRegen") + TEMPLATES[state.currentLang].label + tr("confirmRegenEnd"), () => applyTemplate(state.currentLang));
    return;
  }
  applyTemplate(state.currentLang);
};

document.getElementById("runPyBtn").onclick = runPython;
document.getElementById("importJsonBtn").onclick = importJson;
document.getElementById("previewBtn").onclick = () => {
  if (state.activeFile) previewHtml(state.activeFile);
  else setStatus(tr("noOpenFile"), "warn");
};
document.getElementById("clearOutput").onclick = () => { clearPy(); };
document.getElementById("hideOutput").onclick = () => { showPy(false); };
document.getElementById("closeOutput").onclick = () => { showPy(false); clearPy(); };
document.getElementById("langRu").onclick = () => applyUiLang("ru");
document.getElementById("langEn").onclick = () => applyUiLang("en");

document.getElementById("saveZip").onclick = () => {
  if (typeof JSZip === "undefined") { setStatus(tr("noJSZip"), "warn"); return; }
  const zip = new JSZip();
  const folders = new Set();
  for (const [name, content] of state.project.entries()) {
    zip.file(name, content);
    const parts = name.split("/");
    for (let i = 1; i < parts.length; i++) folders.add(parts.slice(0, i).join("/"));
  }
  folders.forEach(f => zip.folder(f));
  zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } }, meta => {
    setStatus("ZIP: " + Math.floor(meta.percent) + "%", "ok");
  })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Webject.zip";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.dirty.clear();
      state.baseline = new Map(state.project);
      renderTabs();
      setStatus(tr("zipSaved"), "ok");
    })
    .catch(err => setStatus(tr("zipError") + err.message, "err"));
};

document.addEventListener("keydown", e => {
  const ctrl = e.ctrlKey || e.metaKey;
  const inInput = document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA" || document.activeElement.isContentEditable);

  if (els.modalBg.classList.contains("show")) {
    if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
    if (e.key === "Enter" && state.modalMode !== "confirm" && els.modalOk.onclick) {
      e.preventDefault();
      els.modalOk.onclick();
      return;
    }
    return;
  }

  if (ctrl && e.shiftKey && e.key === "S") { e.preventDefault(); document.getElementById("saveZip").click(); return; }
  if (ctrl && !e.shiftKey && e.key === "s") { e.preventDefault(); saveState(); setStatus(tr("savedStorage"), "ok"); return; }
  if (ctrl && e.altKey && e.key.toLowerCase() === "i") { e.preventDefault(); importJson(); return; }
  if (ctrl && e.key === "n") { e.preventDefault(); askNew("file", targetParent()); return; }
  if (ctrl && e.key === "b") { e.preventDefault(); els.sidebar.classList.toggle("hidden"); setTimeout(() => { if (state.cm) state.cm.refresh(); }, 260); return; }
  if (ctrl && e.key === "w") { e.preventDefault(); if (state.activeFile) closeTab(state.activeFile); return; }
  if (ctrl && e.shiftKey && e.key === "F") { e.preventDefault(); openSearch(); return; }
  if (ctrl && e.shiftKey && e.key === "E") { e.preventDefault(); els.searchInput.focus(); els.searchInput.select(); return; }
  if (ctrl && e.shiftKey && e.key === "Z") { e.preventDefault(); redoLast(); return; }
  if (ctrl && !e.shiftKey && e.key === "z" && !inInput && (!state.cm || !state.cm.hasFocus())) { e.preventDefault(); undoLast(); return; }
  if (ctrl && /^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key) - 1;
    if (state.openTabs[idx]) { e.preventDefault(); openFile(state.openTabs[idx]); }
    return;
  }
  if (ctrl && e.key === "Tab") {
    e.preventDefault();
    if (!state.openTabs.length) return;
    const idx = state.openTabs.indexOf(state.activeFile);
    const next = e.shiftKey ? (idx - 1 + state.openTabs.length) % state.openTabs.length : (idx + 1) % state.openTabs.length;
    openFile(state.openTabs[next]);
    return;
  }
  if (e.shiftKey && e.altKey && e.key === "F" && state.activeFile) { e.preventDefault(); formatFile(state.activeFile); return; }
  if (e.key === "F2" && state.selectedPath) { e.preventDefault(); beginRename(state.selectedPath); return; }
  if (e.key === "Delete" && state.selectedPath && (!state.cm || !state.cm.hasFocus())) {
    e.preventDefault();
    if (state.project.has(state.selectedPath)) removeFile(state.selectedPath);
    else removeFolder(state.selectedPath);
    return;
  }
  if (e.key === "Escape") { hideMenu(); return; }

  if (els.tree.contains(document.activeElement) || document.activeElement === els.tree) {
    const nodes = Array.from(els.tree.querySelectorAll(".node"));
    const current = state.selectedPath ? nodes.findIndex(n => n.dataset.path === state.selectedPath) : -1;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      const next = nodes[Math.min(current + 1, nodes.length - 1)];
      if (next) { state.selectedPath = next.dataset.path; nodes.forEach(n => n.setAttribute("tabindex", n === next ? "0" : "-1")); next.focus(); }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      const prev = nodes[Math.max(current - 1, 0)];
      if (prev) { state.selectedPath = prev.dataset.path; nodes.forEach(n => n.setAttribute("tabindex", n === prev ? "0" : "-1")); prev.focus(); }
    } else if (e.key === "ArrowRight" && state.selectedPath && !state.project.has(state.selectedPath)) {
      e.preventDefault();
      state.collapsed.delete(state.selectedPath);
      renderTree();
    } else if (e.key === "ArrowLeft" && state.selectedPath && !state.project.has(state.selectedPath)) {
      e.preventDefault();
      state.collapsed.add(state.selectedPath);
      renderTree();
    } else if (e.key === "Enter" && state.selectedPath) {
      e.preventDefault();
      if (state.project.has(state.selectedPath)) openFile(state.selectedPath);
      else {
        if (state.collapsed.has(state.selectedPath)) state.collapsed.delete(state.selectedPath);
        else state.collapsed.add(state.selectedPath);
        renderTree();
      }
    }
  }
});

function targetParent() {
  if (!state.selectedPath) return "";
  if (state.project.has(state.selectedPath)) return parentOf(state.selectedPath);
  return state.selectedPath;
}

els.tree.addEventListener("contextmenu", e => {
  if (e.target.closest(".node")) return;
  e.preventDefault();
  state.selectedPath = null;
  renderTree();
  openMenu(e.clientX, e.clientY, "empty", "");
});

document.addEventListener("click", e => {
  if (!e.target.closest("#ctxMenu")) hideMenu();
});
document.addEventListener("scroll", hideMenu, true);
window.addEventListener("resize", () => { hideMenu(); if (state.cm) state.cm.refresh(); });

document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  if (e.target.closest("#tree")) return;
  e.preventDefault();
  if (!e.dataTransfer) return;
  const files = [];
  let skippedDirs = false;
  if (e.dataTransfer.items) {
    for (const item of e.dataTransfer.items) {
      if (item.kind !== "file") continue;
      const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
      if (entry && entry.isDirectory) { skippedDirs = true; continue; }
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  } else if (e.dataTransfer.files) files.push(...e.dataTransfer.files);
  if (skippedDirs) setStatus(tr("foldersNotSupported"), "warn");
  if (files.length) addFiles(files);
});

els.searchInput.oninput = () => {
  if (state.treeRaf) cancelAnimationFrame(state.treeRaf);
  state.treeRaf = null;
  renderTree();
};

window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);

function openSearch() {
  openModal("search", "", tr("searchProject"), tr("searchLine"), `<input id="modalInput" placeholder="${tr("searchPlaceholder2")}" autocomplete="off"><div id="searchResults" style="margin-top:10px; font-size:12px; color:var(--muted);"></div>`, tr("searchBtn"));
  const input = els.modalBody.querySelector("#modalInput");
  const results = els.modalBody.querySelector("#searchResults");
  const run = () => {
    const q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!q) { results.textContent = tr("enterQuery"); return; }
    let count = 0;
    const list = document.createElement("div");
    list.style.display = "flex";
    list.style.flexDirection = "column";
    list.style.gap = "4px";
    outer:
    for (const [k, v] of state.project.entries()) {
      const lines = v.split("\n");
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().includes(q)) {
          const item = document.createElement("div");
          item.style.padding = "6px 8px";
          item.style.borderRadius = "6px";
          item.style.cursor = "pointer";
          item.style.background = "var(--panel-2)";
          item.textContent = k + ":" + (i + 1) + " — " + lines[i].slice(0, 120);
          item.onclick = () => { closeModal(); openFile(k); setTimeout(() => { if (state.cm) { state.cm.setCursor({ line: i, ch: 0 }); state.cm.scrollIntoView({ line: i, ch: 0 }, 100); } }, 150); };
          list.appendChild(item);
          count++;
          if (count >= 50) break outer;
        }
      }
    }
    if (!count) results.textContent = tr("nothingFound");
    else { results.appendChild(list); results.insertBefore(document.createTextNode(tr("found") + count + " "), list); }
  };
  els.modalOk.onclick = run;
}

function boot() {
  if (typeof CodeMirror === "undefined") {
    els.editorArea.innerHTML = `<div class="empty"><div class="big">⚠</div>${escapeHtml(tr("noCodeMirror"))}<span>${escapeHtml(tr("checkInternet"))}</span></div>`;
    setStatus(tr("noCodeMirror"), "err");
    return;
  }
  const savedUiLang = localStorage.getItem("webject.uiLang");
  if (savedUiLang && I18N[savedUiLang]) {
    uiLang = savedUiLang;
  } else {
    const browserLang = (navigator.language || "ru").slice(0, 2).toLowerCase();
    uiLang = browserLang === "ru" ? "ru" : "en";
  }
  const loaded = loadState();
  applyUiLang(uiLang);
  if (!loaded) applyTemplate("html");
  else {
    els.langSelect.value = state.currentLang;
    renderTree();
    renderTabs();
    renderEditor();
    setStatus(tr("restored"), "ok");
  }
  updateOnlineStatus();
  updateTitle();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
